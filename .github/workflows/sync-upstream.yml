name: Sync upstream

# Lives on the `docker` branch (the fork's default branch). Never add this file to `main`.
# 1) fast-forward fork main to upstream main   2) merge main into docker (merge, never rebase)
# 3) on conflict/divergence/overlay drift/rejected push: no push, open or update one issue, fail
# 4) on a successful merge: dispatch docker-image.yml (workflow_dispatch is exempt from the
#    "GITHUB_TOKEN events don't start workflows" rule).
#
# Git pushes use secrets.SYNC_TOKEN when set. GITHUB_TOKEN can never be granted the `workflows`
# permission, so GitHub rejects any push carrying an upstream change under .github/workflows/.
# SYNC_TOKEN: fine-grained PAT on this repo only, Contents + Workflows read/write. Without it the
# sync still works until upstream touches a workflow file, then fails with an issue saying so.
# PAT pushes do fire `push` workflows, so the merge commit carries [skip actions] and the image
# build still comes from the explicit dispatch below (honouring trigger_build).

on:
  schedule:
    - cron: '17 3 * * *' # daily 03:17 UTC (13:17 AEST)
  workflow_dispatch:
    inputs:
      trigger_build:
        description: Dispatch the Docker image build after a successful sync
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: bilawalsidhu/gods-eye-view
  UPSTREAM_BRANCH: main
  MIRROR_BRANCH: main
  WORK_BRANCH: docker
  ISSUE_LABEL: upstream-sync
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    name: Mirror main, merge into docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out docker branch
        uses: actions/checkout@v4
        with:
          ref: docker
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream and fork refs
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          git fetch --no-tags origin "${MIRROR_BRANCH}" "${WORK_BRANCH}"
          echo "sha=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short "upstream/${UPSTREAM_BRANCH}")" >> "$GITHUB_OUTPUT"

      - name: Fast-forward mirror branch (main)
        id: mirror
        run: |
          set -euo pipefail
          UP="upstream/${UPSTREAM_BRANCH}"; MIR="origin/${MIRROR_BRANCH}"
          if git merge-base --is-ancestor "$UP" "$MIR"; then
            echo "main already at/after upstream $(git rev-parse --short "$UP")"
            echo "status=current" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$MIR" "$UP"; then
            if git push origin "${UP}:refs/heads/${MIRROR_BRANCH}" 2> "$RUNNER_TEMP/push.err"; then
              cat "$RUNNER_TEMP/push.err" >&2
              echo "status=updated" >> "$GITHUB_OUTPUT"
            else
              cat "$RUNNER_TEMP/push.err" >&2
              { echo 'error<<GEVEOF'; cat "$RUNNER_TEMP/push.err"; echo 'GEVEOF'; } >> "$GITHUB_OUTPUT"
              echo "::error::push to ${MIRROR_BRANCH} was rejected; see the upstream-sync issue"
              echo "status=pushfailed" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::fork ${MIRROR_BRANCH} has commits that are not in upstream; refusing to touch it"
            echo "status=diverged" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into docker
        id: merge
        if: steps.mirror.outputs.status == 'current' || steps.mirror.outputs.status == 'updated'
        run: |
          set -euo pipefail
          UP="upstream/${UPSTREAM_BRANCH}"
          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "docker already contains upstream $(git rev-parse --short "$UP")"
            echo "status=nochange" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-ff --no-edit \
               -m "chore(sync): merge upstream ${UPSTREAM_BRANCH} @ $(git rev-parse --short "$UP") into ${WORK_BRANCH}" \
               -m "[skip actions]" \
               "$UP"; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            { echo 'conflicts<<GEVEOF'; git diff --name-only --diff-filter=U; echo 'GEVEOF'; } >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "::error::merge conflict; see the upstream-sync issue"
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard - docker may only add deploy/** and its two workflows
        id: drift
        if: steps.merge.outputs.status == 'merged'
        run: |
          set -euo pipefail
          UP="upstream/${UPSTREAM_BRANCH}"
          bad="$(git diff --name-only "$UP" HEAD \
                 | grep -Ev '^(deploy/|\.github/workflows/(sync-upstream|docker-image)\.yml$)' || true)"
          if [ -n "$bad" ]; then
            { echo 'files<<GEVEOF'; echo "$bad"; echo 'GEVEOF'; } >> "$GITHUB_OUTPUT"
            echo "::error::docker branch modifies upstream-owned files; not pushing"
            echo "status=drift" >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Push docker
        id: push
        if: steps.merge.outputs.status == 'merged' && steps.drift.outputs.status == 'ok'
        run: |
          set -euo pipefail
          if git push origin "HEAD:refs/heads/${WORK_BRANCH}" 2> "$RUNNER_TEMP/push.err"; then
            cat "$RUNNER_TEMP/push.err" >&2
            echo "status=pushed" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/push.err" >&2
            { echo 'error<<GEVEOF'; cat "$RUNNER_TEMP/push.err"; echo 'GEVEOF'; } >> "$GITHUB_OUTPUT"
            echo "::error::push to ${WORK_BRANCH} was rejected; see the upstream-sync issue"
            echo "status=pushfailed" >> "$GITHUB_OUTPUT"
          fi

      - name: Close a previously opened sync issue
        if: >
          (steps.mirror.outputs.status == 'current' || steps.mirror.outputs.status == 'updated') &&
          steps.merge.outputs.status != 'conflict' &&
          steps.drift.outputs.status != 'drift' &&
          steps.push.outputs.status != 'pushfailed'
        run: |
          set -euo pipefail
          n="$(gh issue list -R "$GITHUB_REPOSITORY" --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue close "$n" -R "$GITHUB_REPOSITORY" \
              -c "Resolved: sync succeeded at upstream ${{ steps.upstream.outputs.short }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi

      - name: Dispatch image build
        if: >
          steps.push.outputs.status == 'pushed' &&
          (github.event_name == 'schedule' || inputs.trigger_build)
        run: |
          gh workflow run docker-image.yml -R "$GITHUB_REPOSITORY" --ref "$WORK_BRANCH" \
            -f reason="upstream sync ${{ steps.upstream.outputs.short }}"

      - name: Open or update the sync issue and fail
        if: >
          failure() ||
          steps.mirror.outputs.status == 'diverged' ||
          steps.mirror.outputs.status == 'pushfailed' ||
          steps.merge.outputs.status == 'conflict' ||
          steps.drift.outputs.status == 'drift' ||
          steps.push.outputs.status == 'pushfailed'
        env:
          MIRROR_STATUS: ${{ steps.mirror.outputs.status }}
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
          DRIFT_STATUS: ${{ steps.drift.outputs.status }}
          PUSH_STATUS: ${{ steps.push.outputs.status }}
          PUSH_ERROR: ${{ steps.mirror.outputs.error || steps.push.outputs.error }}
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          DRIFT_FILES: ${{ steps.drift.outputs.files }}
          UP_SHORT: ${{ steps.upstream.outputs.short }}
          UP_SHA: ${{ steps.upstream.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/issue.md"
          {
            echo "Automated upstream sync **failed** on $(date -u +%Y-%m-%dT%H:%MZ). \`docker\` was not updated."
            echo
            echo "- Upstream: https://github.com/${UPSTREAM_REPO}/commit/${UP_SHA} (\`${UP_SHORT}\`)"
            echo "- Run: ${RUN_URL}"
            echo
            if [ "$MIRROR_STATUS" = "diverged" ]; then
              echo "## Fork \`main\` has diverged from upstream"
              echo
              echo "\`main\` must stay a pure mirror. Inspect with \`git log upstream/main..origin/main\`, move any wanted commit to \`docker\`, then reset the mirror:"
              echo
              echo '```bash'
              echo 'git fetch upstream && git fetch origin'
              echo 'git push --force-with-lease=main origin upstream/main:main'
              echo '```'
            elif [ "$MIRROR_STATUS" = "pushfailed" ] || [ "$PUSH_STATUS" = "pushfailed" ]; then
              echo "## GitHub rejected the push"
              echo
              echo '```'; echo "$PUSH_ERROR"; echo '```'; echo
              if [ "$PUSH_STATUS" = "pushfailed" ]; then
                echo "\`main\` may already have been updated; \`docker\` was not."
                echo
              fi
              if grep -q 'without `workflows` permission' <<< "$PUSH_ERROR"; then
                echo "Upstream changed a file under \`.github/workflows/\`, and the token this job pushes with may not touch workflow files."
                echo
                if [ "$HAS_SYNC_TOKEN" = "true" ]; then
                  echo "The \`SYNC_TOKEN\` secret is set but lacks **Workflows: Read and write** (or has expired). Regenerate it with Contents + Workflows read/write on this repo and update the secret."
                else
                  echo "Fix once: create a fine-grained PAT (repository access: this repo only; permissions: **Contents** and **Workflows** read/write), then save it as the \`SYNC_TOKEN\` Actions secret and re-run this workflow."
                fi
                echo
                echo "To unblock immediately without a token, run \`deploy/scripts/sync-upstream.sh\` locally; it pushes with your own credentials."
              fi
            elif [ "$MERGE_STATUS" = "conflict" ]; then
              echo "## Merge conflict merging upstream into \`docker\`"
              echo
              echo "Conflicting files:"; echo; echo '```'; echo "$CONFLICTS"; echo '```'; echo
              echo "Resolve locally (Git Bash):"
              echo
              echo '```bash'
              echo 'deploy/scripts/sync-upstream.sh            # stops at the conflict, leaves the merge open'
              echo '# for any conflicting file OUTSIDE deploy/, take upstream verbatim:'
              echo '#   git checkout --theirs -- <path> && git add <path>'
              echo '# for deploy/** decide by hand, then:'
              echo 'git commit --no-edit && git push origin docker   # a user push also triggers the image build'
              echo '```'
              echo
              echo "If upstream added its own root-level Docker files this is expected; ours stay under \`deploy/\`."
            elif [ "$DRIFT_STATUS" = "drift" ]; then
              echo "## Overlay drift: \`docker\` modifies upstream-owned files"
              echo
              echo "Only \`deploy/**\`, \`.github/workflows/sync-upstream.yml\` and \`.github/workflows/docker-image.yml\` may differ from upstream. Offending paths:"
              echo; echo '```'; echo "$DRIFT_FILES"; echo '```'; echo
              echo "Fix on \`docker\`: \`git checkout upstream/main -- <path>\` (restores upstream's version), commit, push."
            else
              echo "## A step failed unexpectedly"
              echo
              echo "See the run log for the failing step."
            fi
            echo
            echo "_This issue is updated by each failing run and auto-closed by the next successful one._"
          } > "$body"
          reason="${MERGE_STATUS:-$MIRROR_STATUS}${DRIFT_STATUS:+/$DRIFT_STATUS}"
          if [ "$MIRROR_STATUS" = "pushfailed" ] || [ "$PUSH_STATUS" = "pushfailed" ]; then
            reason="push rejected"
          fi
          title="Upstream sync failed: ${reason:-error} at upstream ${UP_SHORT}"
          n="$(gh issue list -R "$GITHUB_REPOSITORY" --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue edit "$n" -R "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "Still failing as of $(date -u +%Y-%m-%dT%H:%MZ): ${RUN_URL}"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label "$ISSUE_LABEL" --body-file "$body"
          fi
          exit 1

  # Lives here rather than in its own file: the drift guard only lets docker add two workflows.
  token-expiry:
    name: Check SYNC_TOKEN expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      LABEL: sync-token-expiry
      WARN_DAYS: '14'
    steps:
      - name: Warn before SYNC_TOKEN expires
        run: |
          set -euo pipefail
          if [ -z "$SYNC_TOKEN" ]; then
            echo "SYNC_TOKEN not set; nothing to check"; exit 0
          fi
          # GitHub reports a PAT's expiry on every API response it authenticates.
          hdr="$(curl -sS -o /dev/null -D - -w '%{http_code}\n' \
                   -H "Authorization: Bearer $SYNC_TOKEN" -H 'Accept: application/vnd.github+json' \
                   "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
          code="$(tail -n 1 <<< "$hdr")"
          expiry="$(grep -i '^github-authentication-token-expiration:' <<< "$hdr" | cut -d' ' -f2- | tr -d '\r' || true)"

          open_n="$(gh issue list -R "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[0].number // empty')"
          regen="https://github.com/settings/personal-access-tokens"

          if [ "$code" = "401" ]; then
            days=-1; when="already expired or revoked"
          elif [ -z "$expiry" ]; then
            echo "SYNC_TOKEN has no expiry (HTTP $code)"
            [ -z "$open_n" ] || gh issue close "$open_n" -R "$GITHUB_REPOSITORY" -c "SYNC_TOKEN no longer expires."
            exit 0
          else
            days=$(( ( $(date -u -d "$expiry" +%s) - $(date -u +%s) ) / 86400 ))
            when="expires $expiry (in ${days} days)"
          fi
          echo "SYNC_TOKEN $when"
          echo "SYNC_TOKEN $when" >> "$GITHUB_STEP_SUMMARY"

          if [ "$days" -gt "$WARN_DAYS" ]; then
            [ -z "$open_n" ] || gh issue close "$open_n" -R "$GITHUB_REPOSITORY" -c "Renewed: SYNC_TOKEN now $when."
            exit 0
          fi

          title="SYNC_TOKEN $when"
          body="$RUNNER_TEMP/expiry.md"
          {
            echo "The \`SYNC_TOKEN\` secret used by the daily upstream sync $when."
            echo "Once it expires the sync fails with a \"push rejected\" issue and the image stops updating."
            echo
            echo "Renew it:"
            echo
            echo "1. ${regen} → open the token → **Regenerate token** (keep repository access on this repo only, Contents + Workflows read/write)."
            echo "2. \`gh secret set SYNC_TOKEN -R ${GITHUB_REPOSITORY}\` and paste the new value."
            echo
            echo "_Checked daily; this issue closes itself once the new token is in place._"
          } > "$body"
          gh label create "$LABEL" -R "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "SYNC_TOKEN PAT is about to expire" --force >/dev/null
          if [ -z "$open_n" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label "$LABEL" --body-file "$body"
          else
            gh issue edit "$open_n" -R "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
            case "$days" in 7|3|1|0) # re-notify at these points, not every day
              gh issue comment "$open_n" -R "$GITHUB_REPOSITORY" --body "Reminder: SYNC_TOKEN $when." ;;
            esac
          fi
